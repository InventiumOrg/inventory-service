# In each microservice repo
steps:
  - label: ":pipeline: Load code linter pipeline"
    command: |
      git clone https://github.com/InventiumOrg/buildkite-cicd
      cd buildkite-cicd
      buildkite-agent pipeline upload code-linter.yml

  - label: ":shield: Load security scan pipeline"
    command: |
      curl -fsSL https://raw.githubusercontent.com/InventiumOrg/buildkite-cicd/main/templates/security-scan.yml | buildkite-agent pipeline upload -

  - label: ":docker: Load image build pipeline"
    command: |
      curl -fsSL https://raw.githubusercontent.com/InventiumOrg/buildkite-cicd/main/templates/image-build.yml | buildkite-agent pipeline upload -